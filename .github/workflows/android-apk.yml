name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Validate license and release version
        run: |
          test -s LICENSE
          test -s NOTICE
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE
          grep -q "GPL-3.0-only" NOTICE
          VERSION="$(node -p "require('./package.json').version")"
          test "$(node -p "require('./app.json').expo.version")" = "$VERSION"
          test "$(node -p "require('./desktop/package.json').version")" = "$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix desktop ci --no-audit --no-fund

      - name: Full validation
        run: |
          npm run typecheck
          npm run lint
          npm run test:engine
          npm run test:regressions
          npm run test:ui
          npm run desktop:check
          npx expo-doctor

  android:
    name: Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "A version tag requires the Android signing secrets." >&2
              exit 1
            fi
            echo "Signing secrets are absent; manual builds use the debug key."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nightfall-release.jks"
          {
            echo "NIGHTFALL_RELEASE_STORE_FILE=$RUNNER_TEMP/nightfall-release.jks"
            echo "NIGHTFALL_RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "NIGHTFALL_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "NIGHTFALL_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Verify APK privacy boundary
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -n "$APKANALYZER"
          PERMISSIONS="$("$APKANALYZER" manifest permissions "$APK")"
          printf '%s\n' "$PERMISSIONS"
          if printf '%s\n' "$PERMISSIONS" | grep -E 'android.permission.(INTERNET|SYSTEM_ALERT_WINDOW|CAMERA|RECORD_AUDIO)'; then
            echo "APK contains a permission that violates the offline privacy boundary." >&2
            exit 1
          fi
          MANIFEST="$("$APKANALYZER" manifest print "$APK")"
          if ! printf '%s\n' "$MANIFEST" | grep -q 'android:allowBackup="false"'; then
            echo "APK must disable Android auto backup." >&2
            exit 1
          fi

      - name: Name Android files
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          FILE="nightfall-host-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$FILE"
          sha256sum "$FILE" > "$FILE.sha256"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            nightfall-host-*.apk
            nightfall-host-*.apk.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows desktop
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix desktop ci --no-audit --no-fund

      - name: Build Windows packages
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run desktop:prepare
          npm --prefix desktop run build:win
          Get-ChildItem build-output/desktop/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii -LiteralPath "$($_.FullName).sha256"
          }

      - name: Smoke-test Electron runtime
        env:
          NIGHTFALL_DESKTOP_EXECUTABLE: build-output/desktop/win-unpacked/夜幕主持助手.exe
        run: npm run desktop:smoke

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-desktop
          path: |
            build-output/desktop/*.exe
            build-output/desktop/*.exe.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS desktop
    needs: validate
    runs-on: macos-15-intel
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix desktop ci --no-audit --no-fund

      - name: Build macOS DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run desktop:prepare
          npm --prefix desktop run build:mac -- --x64
          npm --prefix desktop run build:mac -- --arm64
          (
            cd build-output/desktop
            for file in *.dmg; do
              hdiutil verify "$file"
              shasum -a 256 "$file" > "$file.sha256"
            done
          )

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-desktop
          path: |
            build-output/desktop/*.dmg
            build-output/desktop/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unsigned IPA
    needs: validate
    runs-on: macos-26
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned iOS app
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          test -n "$WORKSPACE"
          SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const parsed = JSON.parse(data); const schemes = parsed.workspace?.schemes ?? parsed.project?.schemes ?? []; if (!schemes[0]) process.exit(1); process.stdout.write(schemes[0]); });")"
          test -n "$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APP="$(find "$RUNNER_TEMP/ios-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -n 1)"
          test -d "$APP"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          test "$BUNDLE_ID" = "com.nightfall.werewolfhost"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          FILE="nightfall-host-${VERSION}-ios-unsigned.ipa"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/$FILE" Payload)
          shasum -a 256 "$FILE" > "$FILE.sha256"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: |
            nightfall-host-*-ios-unsigned.ipa
            nightfall-host-*-ios-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - android
      - windows
      - macos
      - ios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          (
            cd release-assets
            for file in *; do
              case "$file" in
                *.sha256) continue ;;
              esac
              sha256sum "$file" > "$file.sha256"
            done
          )
          cat > release-notes.md <<EOF
          夜幕 ${VERSION} 多端正式发布。

          ### 安装包说明

          - Android：签名 APK，可直接安装，后续同签名正式版可覆盖升级。
          - Windows：提供安装版和免安装版；当前未购买 Windows 代码签名证书，SmartScreen 可能显示“未知发布者”。
          - macOS：提供 Intel 与 Apple Silicon 两个 DMG；当前未签名、未公证，首次打开需在“系统设置 → 隐私与安全性”中允许。
          - iOS：提供未签名 IPA。当前仓库没有 Apple Developer 签名证书，不能直接双击安装；需使用 Xcode、Sideloadly 或 AltStore 按你的 Apple ID 重新签名。

          ### 多端变化

          Android、iOS、Windows、macOS 共用本地规则引擎与同一套存档格式。桌面端使用离线本地协议运行，不加载远程页面；SQLite 存储启用跨源隔离，不申请联网权限。Windows/macOS 增加系统原生“另存为”备份入口，iOS/Android 保留文件分享与本地导入。

          应用图标采用用户提供的“血月狼人杀徽章”。

          安装包均附 SHA-256。卸载 Android 或 iOS App 会删除本机数据，请先在“个性化 → 本机数据”导出备份；Windows/macOS 卸载前也建议导出。

          ---

          ### 许可证

          本项目源代码及此 Release 中的官方发布物采用 **GPL-3.0-only**。许可证全文见随附的 LICENSE 文件，第三方权利说明见 NOTICE。分发修改后的安装包时，必须按同一许可证向接收者提供对应源代码。
          EOF
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* LICENSE NOTICE --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "夜幕 $VERSION" --notes-file release-notes.md --latest
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* LICENSE NOTICE \
              --repo "$GITHUB_REPOSITORY" \
              --title "夜幕 $VERSION" \
              --notes-file release-notes.md \
              --latest
          fi
