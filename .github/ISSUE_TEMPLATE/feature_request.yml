name: 功能与流程建议
description: 提出新玩法、主持流程、桌规设置或界面改进建议
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先说明线下实际场景，再描述希望怎么操作。不同门店和赛事的桌规可以不同，软件会优先做成可配置选项。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 什么板子、什么人数、主持人现在怎样处理
      placeholder: 例如：12 人局，发牌后不公开身份，天黑后按角色逐步确认
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前哪里不方便
      description: 说明现有步骤过多、容易误触、信息不明显或流程不一致的地方
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改
      description: 可以用“主持人看到什么、点什么、下一步是什么”来描述
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 主要涉及
      options:
        - 开局与桌规
        - 夜间流程
        - 天亮与放逐
        - 技能与角色规则
        - 玩家模式
        - 界面与动效
        - 安装、存档或备份
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他可行方式
      description: 可选；说明别的门店或线上工具怎样处理
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue 和 Discussions，未找到相同建议
          required: true
